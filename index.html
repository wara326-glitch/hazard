<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>つかえるハザードマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17212b}#app{display:flex;flex-direction:column;background:#eef3f7}header{background:#073b67;color:#fff;padding:10px 12px;z-index:1000}h1{font-size:24px;margin:0 0 8px}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px;font-size:17px}.search button,.mode{border:0;border-radius:12px;padding:0 14px;font-weight:900;font-size:15px}.go{background:#ffd43b}.loc{background:#fff;color:#073b67}.modebar{display:flex;gap:7px;margin-top:8px}.mode{padding:9px 16px;background:#fff;color:#073b67}.mode.active{background:#ffd43b;color:#17212b}.status{font-size:12px;margin-top:7px;min-height:16px}.body{display:grid;grid-template-columns:410px 1fr;flex:1;min-height:0}.panel{background:#fff;padding:12px;overflow:auto;border-right:1px solid #ccd8e2}.summary{background:#f3f6f8;border-radius:14px;padding:12px}.summary strong{font-size:19px}.coords{font-size:11px;color:#68737d;margin-top:3px}.headline{border:3px solid #d8e0e6;border-radius:15px;padding:12px;margin:10px 0;font-weight:900;font-size:18px}.headline.hit{border-color:#d93025;background:#fff1f0;color:#a61b13}.headline.clear{border-color:#49a66f;background:#f1fbf5;color:#146b38}.headline.wait{color:#68737d}.panel h2{font-size:16px;margin:13px 0 8px}.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.risk{border:2px solid #dce4ea;border-radius:12px;padding:10px;background:#fff;min-height:72px}.risk .name{font-size:13px;font-weight:800}.risk .value{font-size:16px;font-weight:900;margin-top:5px}.risk.hit{border-color:#d93025;background:#fff1f0}.risk.hit .value{color:#b42318}.risk.clear{border-color:#49a66f;background:#f1fbf5}.risk.clear .value{color:#16713b}.risk.unknown{background:#f5f6f7;color:#68737d}.risk.ref{border-color:#d49b00;background:#fff9e8}.risk.ref .value{color:#8a6100}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{border:1px solid #ccd8e2;background:#fff;border-radius:9px;padding:9px 6px;text-align:left;font-weight:750;font-size:12px}.chip.on{background:#e4f3ff;border-color:#2581bd;color:#075985}.note{font-size:10px;line-height:1.5;color:#5e6b76;background:#f5f7f9;padding:8px;border-radius:9px;margin-top:10px}.mapbox{position:relative;min-height:0}#map{height:100%;width:100%}.hint{position:absolute;right:10px;top:10px;z-index:800;background:#fffffff0;padding:8px;border-radius:9px;font-size:12px;box-shadow:0 3px 14px #0002}.pin{width:30px;height:30px;background:#d93025;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #d9302550}.pin.safe{background:#198754;box-shadow:0 0 0 8px #19875450}.pin.wait{background:#f4b400;box-shadow:0 0 0 8px #f4b40050}.leaflet-tooltip.hazard-tip{border:0;border-radius:10px;background:#fff;box-shadow:0 4px 18px #0003;padding:8px 10px;font-weight:800;max-width:280px;white-space:normal}.leaflet-tooltip.hazard-tip:before{display:none}@media(max-width:760px){header{padding:8px}h1{font-size:21px}.search input{padding:13px 9px}.search button{padding:0 10px}.loc{font-size:0}.loc:after{content:'◎';font-size:20px}.body{display:flex;flex-direction:column}.mapbox{order:1;height:50vh;flex:none}.panel{order:2;border:0;border-top:2px solid #ccd8e2;overflow:visible;padding:9px}.riskgrid{grid-template-columns:1fr 1fr}.risk{min-height:78px}.risk .value{font-size:17px}}</style></head><body><div id="app"><header><h1>🛡️ つかえるハザードマップ</h1><form id="form" class="search"><input id="q" autocomplete="postal-code" placeholder="住所・郵便番号（例 963-8052）"><button class="go">検索</button><button type="button" class="loc" id="loc">◎ 現在地</button></form><div class="modebar"><button id="b2d" class="mode active">2D</button><button id="b3d" class="mode">3D</button></div><div id="status" class="status">住所・郵便番号を入力、または地図をタップしてください。</div></header><div class="body"><aside class="panel"><div class="summary"><strong id="place">地点を選択してください</strong><div id="coords" class="coords">—</div></div><div id="headline" class="headline wait">📍 地点を選択すると全ハザードを確認</div><h2>この地点の全ハザード</h2><div id="riskgrid" class="riskgrid"></div><h2>2D地図に重ねる</h2><div id="chips" class="chips"></div><div class="note">赤＝公開タイル上で該当を検出。緑＝そのタイルでは着色を検出せず。黄＝地域・自治体ごとの資料確認が必要。液状化・ため池・火山等は全国一律の地点自動判定ができない場合があるため「要地域資料確認」とします。最新・詳細情報は自治体等の公式ハザードマップを確認してください。</div></aside><main class="mapbox"><div id="map"></div><div class="hint">📍 タップした地点を自動判定</div></main></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([37.4,140.38],9);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル © 国土地理院'}).addTo(map);const D={flood:{n:'🌊 洪水（想定最大）',s:'洪水',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},floodplan:{n:'🌊 洪水（計画規模）',s:'洪水・計画',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l1_shinsuishin_newlegend_data/{z}/{x}/{y}.png',depth:1},duration:{n:'⏱️ 浸水継続時間',s:'浸水継続',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_keizoku_data/{z}/{x}/{y}.png'},collapseflow:{n:'🏠 家屋倒壊・氾濫流',s:'家屋倒壊・氾濫流',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png'},collapsebank:{n:'🏠 家屋倒壊・河岸侵食',s:'家屋倒壊・河岸侵食',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png'},inland:{n:'💧 内水',s:'内水',u:'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',depth:1},hightide:{n:'🌊 高潮',s:'高潮',u:'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},tsunami:{n:'🌊 津波',s:'津波',u:'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',depth:1},doseki:{n:'⛰️ 土石流',s:'土石流',u:'https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'},steep:{n:'⛰️ 急傾斜地',s:'急傾斜地',u:'https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png'},slide:{n:'⛰️ 地すべり',s:'地すべり',u:'https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'},volcano:{n:'🌋 火山地形',s:'火山',u:'https://cyberjapandata.gsi.go.jp/xyz/vlcd/{z}/{x}/{y}.png',visual:1}};const REF=[['liquefaction','🫧 液状化'],['pond','🏞️ ため池'],['volcanohazard','🌋 火山ハザード'],['threeD','🏢 3次元浸水']];const layers={};for(const[k,d]of Object.entries(D)){layers[k]=L.tileLayer(d.u,{maxZoom:17,opacity:.68,errorTileUrl:''});const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=d.n;b.onclick=()=>{map.hasLayer(layers[k])?(map.removeLayer(layers[k]),b.classList.remove('on')):(layers[k].addTo(map),b.classList.add('on'))};chips.appendChild(b)}['flood','inland','tsunami','doseki','steep','slide'].forEach(k=>{layers[k].addTo(map);document.querySelector('[data-k="'+k+'"]').classList.add('on')});function tileXY(lat,lng,z=17){const n=2**z,x=(lng+180)/360*n,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n;return{z,tx:Math.floor(x),ty:Math.floor(y),px:Math.floor((x%1)*256),py:Math.floor((y%1)*256)}}function U(d,t){return d.u.replace('{z}',t.z).replace('{x}',t.tx).replace('{y}',t.ty)}function depth(r,g,b,a){if(a<20)return null;const C=[[247,245,169,'0.3m未満'],[255,216,192,'0.3〜0.5m'],[255,183,183,'0.5〜1m'],[255,145,145,'1〜3m'],[242,133,201,'3〜5m'],[220,122,220,'5〜10m'],[180,110,210,'10〜20m'],[145,90,180,'20m以上']];let q=C[0],bd=1e9;for(const c of C){let d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bd){bd=d;q=c}}return bd<8000?q[3]:'区域内'}async function judge(k,lat,lng){const d=D[k];if(d.visual)return{v:'地図表示で確認',c:'ref'};const t=tileXY(lat,lng);try{const im=new Image;im.crossOrigin='anonymous';im.src=U(d,t);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no});const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.drawImage(im,0,0);let p=null;outer:for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const a=x.getImageData(Math.max(0,Math.min(255,t.px+dx)),Math.max(0,Math.min(255,t.py+dy)),1,1).data;if(a[3]>25){p=a;break outer}}if(!p)return{v:'着色検出なし',c:'clear'};return{v:d.depth?(depth(...p)||'区域内'):'区域内',c:'hit'}}catch(e){return{v:'判定できません',c:'unknown'}}}function pinIcon(c='wait'){return L.divIcon({className:'',html:'<div class="pin '+c+'"></div>',iconSize:[30,30],iconAnchor:[15,15]})}let marker,last=null;function portal3d(){if(!last)return;const u='https://disaportal.gsi.go.jp/maps/?base=pale&ll='+last.lat+'%2C'+last.lng+'&vs=c1j0l1u0t1h1z0&z=16';window.open(u,'_blank','noopener')}b3d.onclick=()=>{if(!last){status.textContent='先に住所・郵便番号・地図タップで地点を選んでください。';return}b3d.classList.add('active');b2d.classList.remove('active');portal3d()};b2d.onclick=()=>{b2d.classList.add('active');b3d.classList.remove('active');map.invalidateSize()};async function assess(lat,lng){const entries=Object.entries(D);riskgrid.innerHTML=entries.map(([k,d])=>'<div class="risk unknown" id="r_'+k+'"><div class="name">'+d.n+'</div><div class="value">判定中…</div></div>').join('')+REF.map(([k,n])=>'<div class="risk ref" id="r_'+k+'"><div class="name">'+n+'</div><div class="value">要地域資料確認</div></div>').join('');headline.className='headline wait';headline.textContent='⏳ 全ハザードを確認中…';const rs=await Promise.all(entries.map(async([k])=>[k,await judge(k,lat,lng)]));for(const[k,r]of rs){const e=document.getElementById('r_'+k);e.className='risk '+r.c;e.querySelector('.value').textContent=r.v}const hits=rs.filter(([,r])=>r.c==='hit');if(hits.length){headline.className='headline hit';headline.innerHTML='⚠️ <b>'+hits.length+'項目</b>で該当を検出<br>'+hits.map(([k,r])=>D[k].s+(r.v==='区域内'?'':' '+r.v)).join(' ／ ');marker.setIcon(pinIcon(''));marker.bindTooltip('⚠️ '+hits.map(([k,r])=>D[k].s+(r.v==='区域内'?'':' '+r.v)).join('・'),{permanent:true,direction:'top',offset:[0,-18],className:'hazard-tip'}).openTooltip()}else{headline.className='headline clear';headline.textContent='✓ 公開タイル上で該当着色を検出しませんでした';marker.setIcon(pinIcon('safe'));marker.bindTooltip('✓ 着色検出なし',{permanent:true,direction:'top',offset:[0,-18],className:'hazard-tip'}).openTooltip()}status.textContent='全ハザード一覧を更新しました。3Dボタンで国の3D表示を開けます。'}function point(lat,lng,label){last={lat,lng};if(marker)marker.remove();marker=L.marker([lat,lng],{icon:pinIcon()}).addTo(map);place.textContent=label||'選択地点';coords.textContent=lat.toFixed(6)+', '+lng.toFixed(6);assess(lat,lng)}map.on('click',e=>{map.setView(e.latlng,17);point(e.latlng.lat,e.latlng.lng,'地図上で選択した地点')});async function geocode(s){try{const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(s));const j=await r.json();return j&&j[0]}catch(e){return null}}function postal(s){return s.replace(/[〒\s-]/g,'').match(/^\d{7}$/)?.[0]||null}async function postalAddress(code){try{const r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+code);const j=await r.json(),a=j?.results?.[0];return a?{address:(a.address1||'')+(a.address2||'')+(a.address3||''),label:'〒'+code.slice(0,3)+'-'+code.slice(3)+' '+(a.address1||'')+(a.address2||'')+(a.address3||'')}:null}catch(e){return null}}form.onsubmit=async e=>{e.preventDefault();const v=q.value.trim();if(!v)return;status.textContent='検索中…';let s=v,label=v,pc=postal(v);if(pc){const a=await postalAddress(pc);if(!a){status.textContent='郵便番号を特定できませんでした。';return}s=a.address;label=a.label}const h=await geocode(s);if(!h){status.textContent='場所を特定できませんでした。';return}const[lng,lat]=h.geometry.coordinates;map.setView([lat,lng],17);point(lat,lng,pc?label:(h.properties?.title||v))};loc.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],17);point(p.coords.latitude,p.coords.longitude,'現在地')},()=>status.textContent='位置情報を取得できませんでした。',{enableHighAccuracy:true,timeout:10000});</script></body></html>
