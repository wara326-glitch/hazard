<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>災害リスクマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#15202b}#app{display:flex;flex-direction:column;background:#eef3f7}header{background:#073b67;color:#fff;padding:12px 14px;z-index:1000}h1{font-size:24px;margin:0 0 8px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:15px;font-size:18px}.search button{border:0;border-radius:12px;padding:0 18px;font-size:16px;font-weight:800}.go{background:#ffd43b}.loc{background:#fff;color:#073b67}.status{font-size:13px;min-height:18px;margin-top:7px}.body{display:grid;grid-template-columns:390px 1fr;flex:1;min-height:0}.panel{background:#fff;padding:14px;overflow:auto;border-right:1px solid #ccd8e2}.panel h2{font-size:17px;margin:6px 0 10px}.summary{border-radius:14px;padding:13px;margin-bottom:12px;background:#f3f6f8}.summary strong{font-size:20px}.coords{font-size:11px;color:#637381;margin-top:4px}.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.risk{border:2px solid #dce4ea;border-radius:13px;padding:11px;background:#fff;min-height:75px}.risk .name{font-weight:800;font-size:14px}.risk .value{font-weight:900;font-size:17px;margin-top:5px}.risk.hit{border-color:#d93025;background:#fff1f0}.risk.hit .value{color:#b42318}.risk.clear{border-color:#49a66f;background:#f1fbf5}.risk.clear .value{color:#16713b}.risk.unknown{background:#f5f6f7;color:#68737d}.section{margin-top:15px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chip{border:1px solid #ccd8e2;background:#fff;border-radius:10px;padding:11px 7px;text-align:left;font-weight:750}.chip.on{background:#e4f3ff;border-color:#2581bd;color:#075985}.note{font-size:11px;line-height:1.55;color:#5e6b76;background:#f5f7f9;padding:9px;border-radius:9px;margin-top:10px}.mapbox{position:relative;min-height:0}#map{height:100%;width:100%}.hint{position:absolute;right:10px;top:10px;z-index:800;background:#ffffffe8;padding:9px;border-radius:9px;font-size:12px;box-shadow:0 3px 14px #0002}.pin{width:22px;height:22px;background:#d93025;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 6px #d9302544}@media(max-width:760px){header{padding:9px 10px}h1{font-size:21px}.search input{font-size:17px;padding:14px 10px}.search button{padding:0 12px}.loc{font-size:0}.loc:after{content:'◎';font-size:21px}.body{display:flex;flex-direction:column}.mapbox{order:1;flex:none;height:53vh}.panel{order:2;border:0;border-top:2px solid #ccd8e2;padding:10px;overflow:visible}.summary strong{font-size:21px}.riskgrid{grid-template-columns:1fr 1fr}.risk{min-height:82px}.risk .name{font-size:14px}.risk .value{font-size:18px}.chips{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"><header><h1>🛡️ 災害リスクマップ</h1><form id="form" class="search"><input id="q" placeholder="住所を入力"><button class="go">検索</button><button type="button" class="loc" id="loc">◎ 現在地</button></form><div id="status" class="status">住所を入力、または地図をタップしてください。</div></header><div class="body"><aside class="panel"><div class="summary"><strong id="place">地点を選択してください</strong><div id="coords" class="coords">—</div></div><h2>この場所のハザード</h2><div id="riskgrid" class="riskgrid"></div><div class="section"><h2>地図に重ねる情報</h2><div id="chips" class="chips"></div></div><div class="note">着色がない場合でも「安全」を意味するとは限りません。データ未整備・対象外の場合があります。地点判定は公開タイルの画素色を用いた簡易判定です。避難判断は自治体・気象庁等の最新情報を優先してください。</div></aside><main class="mapbox"><div id="map"></div><div class="hint">地図をタップ → その地点を自動判定</div></main></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([37.40,140.38],9);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル © 国土地理院'}).addTo(map);const D={flood:{n:'🌊 洪水（想定最大）',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},floodplan:{n:'🌊 洪水（計画規模）',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l1_shinsuishin_newlegend_data/{z}/{x}/{y}.png',depth:1},duration:{n:'⏱️ 浸水継続時間',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_keizoku_data/{z}/{x}/{y}.png'},collapseflow:{n:'🏠 家屋倒壊・氾濫流',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png'},collapsebank:{n:'🏠 家屋倒壊・河岸侵食',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png'},inland:{n:'💧 内水',u:'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',depth:1},hightide:{n:'🌊 高潮',u:'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},tsunami:{n:'🌊 津波',u:'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',depth:1},doseki:{n:'⛰️ 土石流',u:'https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'},steep:{n:'⛰️ 急傾斜地',u:'https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png'},slide:{n:'⛰️ 地すべり',u:'https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'}};const layers={};for(const[k,d]of Object.entries(D)){layers[k]=L.tileLayer(d.u,{maxZoom:17,opacity:.72,errorTileUrl:''});const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=d.n;b.onclick=()=>{map.hasLayer(layers[k])?(map.removeLayer(layers[k]),b.classList.remove('on')):(layers[k].addTo(map),b.classList.add('on'))};chips.appendChild(b)}['flood','inland','hightide','tsunami','doseki','steep','slide'].forEach(k=>{layers[k].addTo(map);document.querySelector('[data-k="'+k+'"]').classList.add('on')});function tileXY(lat,lng,z=17){const n=2**z,x=(lng+180)/360*n,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n;return{z,tx:Math.floor(x),ty:Math.floor(y),px:Math.floor((x%1)*256),py:Math.floor((y%1)*256)}}function url(d,t){return d.u.replace('{z}',t.z).replace('{x}',t.tx).replace('{y}',t.ty)}function depthLabel(r,g,b,a){if(a<20)return null;const C=[[247,245,169,'0.3m未満'],[255,216,192,'0.3〜0.5m'],[255,183,183,'0.5〜1m'],[255,145,145,'1〜3m'],[242,133,201,'3〜5m'],[220,122,220,'5〜10m'],[180,110,210,'10〜20m'],[145,90,180,'20m以上']];let best=C[0],bd=1e9;for(const c of C){const d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bd){bd=d;best=c}}return bd<8000?best[3]:'区域内'}async function judge(k,lat,lng){const d=D[k],t=tileXY(lat,lng);try{const im=new Image;im.crossOrigin='anonymous';im.src=url(d,t);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no});const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.drawImage(im,0,0);let found=null;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const p=x.getImageData(Math.max(0,Math.min(255,t.px+dx)),Math.max(0,Math.min(255,t.py+dy)),1,1).data;if(p[3]>25){found=p;break}}if(!found)return{v:'区域外 / データなし',c:'clear'};return{v:d.depth?(depthLabel(...found)||'区域内'):'区域内',c:'hit'}}catch(e){return{v:'判定できません',c:'unknown'}}}async function assess(lat,lng){riskgrid.innerHTML=Object.entries(D).map(([k,d])=>'<div class="risk unknown" id="r_'+k+'"><div class="name">'+d.n+'</div><div class="value">判定中…</div></div>').join('');const results=await Promise.all(Object.keys(D).map(async k=>[k,await judge(k,lat,lng)]));for(const[k,r]of results){const e=document.getElementById('r_'+k);e.className='risk '+r.c;e.querySelector('.value').textContent=r.v}status.textContent='地点のハザード判定が完了しました。'}let marker;async function point(lat,lng,label){if(marker)marker.remove();marker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);place.textContent=label||'選択地点';coords.textContent=lat.toFixed(6)+', '+lng.toFixed(6);status.textContent='ハザード情報を判定中…';assess(lat,lng)}map.on('click',e=>{map.setView(e.latlng,17);point(e.latlng.lat,e.latlng.lng,'地図上で選択した地点')});async function geocode(s){try{const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(s));const j=await r.json();return j&&j[0]}catch(e){return null}}form.onsubmit=async e=>{e.preventDefault();const v=q.value.trim();if(!v)return;status.textContent='住所を検索中…';const h=await geocode(v);if(!h){status.textContent='住所を特定できませんでした。';return}const[lng,lat]=h.geometry.coordinates;map.setView([lat,lng],17);point(lat,lng,h.properties?.title||v)};loc.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],17);point(p.coords.latitude,p.coords.longitude,'現在地')},()=>status.textContent='位置情報を取得できませんでした。',{enableHighAccuracy:true,timeout:10000});</script></body></html>
