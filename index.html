<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>災害リスクマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17212b}#app{display:flex;flex-direction:column;background:#f4f7fa}header{background:linear-gradient(135deg,#081f3b,#0d4c7d);color:white;padding:12px 14px;z-index:1000}h1{font-size:20px;margin:0}.sub{font-size:11px;opacity:.85;margin:3px 0 10px}.search{display:flex;gap:7px;max-width:900px}.search input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;font-size:16px}.search button{border:0;border-radius:10px;padding:0 14px;font-weight:700}.go{background:#ffca28}.loc{background:#fff;color:#174e7b}.status{font-size:11px;min-height:14px;margin-top:6px}.body{display:grid;grid-template-columns:310px 1fr;flex:1;min-height:0}.panel{background:#fff;padding:13px;overflow:auto;border-right:1px solid #d8e2ec}.panel h2{font-size:14px;color:#334e68;margin:4px 0 9px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chip{border:1px solid #d8e2ec;background:white;border-radius:9px;padding:9px 7px;text-align:left;font-weight:700;color:#40566b}.chip.on{background:#eaf5ff;border-color:#3b82b8;color:#075985}.card{margin-top:14px;border:1px solid #d8e2ec;border-radius:11px;padding:11px}.place{font-weight:800;line-height:1.45}.coords{font-size:11px;color:#607080;margin-top:4px}.rows{margin-top:8px}.row{display:flex;justify-content:space-between;border-top:1px solid #edf2f7;padding:7px 0;font-size:13px}.badge{font-size:10px;background:#e8eef5;border-radius:20px;padding:3px 7px}.note{font-size:11px;line-height:1.55;color:#607080;background:#f7fafc;padding:8px;border-radius:8px;margin-top:9px}.links a{display:block;color:#075985;text-decoration:none;padding:9px 0;border-bottom:1px solid #edf2f7;font-size:13px}.mapbox{position:relative;min-height:0}#map{height:100%;width:100%}.hint{position:absolute;right:10px;top:10px;z-index:800;background:#fffd;padding:8px;border-radius:8px;font-size:11px;box-shadow:0 4px 18px #0002}.pin{width:18px;height:18px;background:#d32f2f;border:3px solid white;border-radius:50%;box-shadow:0 0 0 5px #d32f2f44}@media(max-width:720px){header{padding:9px 10px}h1{font-size:17px}.body{display:flex;flex-direction:column}.mapbox{order:1;flex:1;min-height:45vh}.panel{order:2;max-height:42vh;border:0;border-top:1px solid #d8e2ec;padding:9px}.chips{grid-template-columns:repeat(3,1fr)}.chip{font-size:12px;padding:8px 5px}.loc{font-size:0}.loc:after{content:'◎';font-size:18px}}</style></head><body><div id="app"><header><h1>🛡️ 災害リスクマップ</h1><div class="sub">住所・現在地から身のまわりのハザードを確認</div><form id="form" class="search"><input id="q" placeholder="住所を入力 例：福島県郡山市八山田7-115"><button class="go">検索</button><button type="button" class="loc" id="loc">◎ 現在地</button></form><div id="status" class="status">住所を入力するか、地図をタップしてください。</div></header><div class="body"><aside class="panel"><h2>表示するハザード</h2><div class="chips" id="chips"></div><div class="card"><h2>選択地点</h2><div id="place" class="place">地点を選択してください</div><div id="coords" class="coords">—</div><div id="rows" class="rows"><div class="note">初版では地点リスクを機械判定せず、公的ハザードレイヤーと検索地点の重なりを確認する方式です。</div></div></div><div class="links"><h2>公式情報で確認</h2><a id="official" target="_blank" rel="noopener" href="https://disaportal.gsi.go.jp/">重ねるハザードマップ ↗</a><a target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/">気象庁 防災情報 ↗</a></div><div class="note">データ未整備地域もあります。避難判断は自治体・気象庁等の最新情報を優先してください。</div></aside><main class="mapbox"><div id="map"></div><div class="hint">地図をタップして地点を選択できます</div></main></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([37.40,140.38],9);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル © 国土地理院'}).addTo(map);const D={flood:['🌊 洪水','https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'],doseki:['⛰️ 土石流','https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'],steep:['⛰️ がけ崩れ','https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png'],slide:['⛰️ 地すべり','https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'],tsunami:['🌊 津波','https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png'],hightide:['🌊 高潮','https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png'],inland:['💧 内水','https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png']},layers={};for(const[k,d]of Object.entries(D)){layers[k]=L.tileLayer(d[1],{maxZoom:17,opacity:.72,errorTileUrl:''});const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;b.textContent=d[0];b.onclick=()=>{map.hasLayer(layers[k])?(map.removeLayer(layers[k]),b.classList.remove('on')):(layers[k].addTo(map),b.classList.add('on'));refreshRows()};chips.appendChild(b)}['flood','doseki','steep','tsunami'].forEach(k=>{layers[k].addTo(map);document.querySelector('[data-k="'+k+'"]').classList.add('on')});let marker,lastPoint;function refreshRows(){if(!lastPoint)return;rows.innerHTML=Object.entries(D).filter(([k])=>map.hasLayer(layers[k])).map(([,d])=>'<div class="row"><span>'+d[0]+'</span><span class="badge">地図で確認</span></div>').join('')+'<div class="note">検索地点のピンと着色区域が重なるか確認してください。公式リンクから同じ地点を詳しく確認できます。</div>'}function point(lat,lng,label){lastPoint=[lat,lng];if(marker)marker.remove();marker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);place.textContent=label||'地図上で選択した地点';coords.textContent=lat.toFixed(6)+', '+lng.toFixed(6);official.href='https://disaportal.gsi.go.jp/hazardmap/maps/index.html?base=pale&ll='+lat.toFixed(6)+'%2C'+lng.toFixed(6)+'&z=15';refreshRows()}map.on('click',e=>point(e.latlng.lat,e.latlng.lng,'地図上で選択した地点'));async function geocode(q){try{const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));const j=await r.json();return j&&j[0]}catch(e){return null}}form.onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status'),qv=q.value.trim();if(!qv)return;s.textContent='住所を検索中…';const h=await geocode(qv);if(!h){s.textContent='住所を特定できませんでした。表記を変えてお試しください。';return}const[lng,lat]=h.geometry.coordinates;map.setView([lat,lng],16);point(lat,lng,h.properties?.title||qv);s.textContent='検索地点を表示しました。着色区域との重なりをご確認ください。'};loc.onclick=()=>{status.textContent='現在地を取得中…';navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;map.setView([lat,lng],16);point(lat,lng,'現在地');status.textContent='現在地を表示しました。'},()=>status.textContent='位置情報を取得できませんでした。',{enableHighAccuracy:true,timeout:10000}):status.textContent='この端末では位置情報を利用できません。'};</script></body></html>
