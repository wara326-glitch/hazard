<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>災害リスクマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#15202b}#app{display:flex;flex-direction:column;background:#eef3f7}header{background:#073b67;color:#fff;padding:12px 14px;z-index:1000}h1{font-size:24px;margin:0 0 8px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:15px;font-size:18px}.search button{border:0;border-radius:12px;padding:0 18px;font-size:16px;font-weight:800}.go{background:#ffd43b}.loc{background:#fff;color:#073b67}.status{font-size:13px;min-height:18px;margin-top:7px}.body{display:grid;grid-template-columns:390px 1fr;flex:1;min-height:0}.panel{background:#fff;padding:14px;overflow:auto;border-right:1px solid #ccd8e2}.panel h2{font-size:17px;margin:6px 0 10px}.summary{border-radius:14px;padding:13px;margin-bottom:12px;background:#f3f6f8}.summary strong{font-size:20px}.coords{font-size:11px;color:#637381;margin-top:4px}.headline{border:3px solid #d8e0e6;border-radius:16px;padding:13px;margin:10px 0;font-weight:900;font-size:20px;background:#fff}.headline.hit{border-color:#d93025;background:#fff1f0;color:#a61b13}.headline.clear{border-color:#49a66f;background:#f1fbf5;color:#146b38}.headline.wait{color:#66727d}.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.risk{border:2px solid #dce4ea;border-radius:13px;padding:11px;background:#fff;min-height:75px}.risk .name{font-weight:800;font-size:14px}.risk .value{font-weight:900;font-size:17px;margin-top:5px}.risk.hit{border-color:#d93025;background:#fff1f0}.risk.hit .value{color:#b42318}.risk.clear{border-color:#49a66f;background:#f1fbf5}.risk.clear .value{color:#16713b}.risk.unknown{background:#f5f6f7;color:#68737d}.section{margin-top:15px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chip{border:1px solid #ccd8e2;background:#fff;border-radius:10px;padding:11px 7px;text-align:left;font-weight:750}.chip.on{background:#e4f3ff;border-color:#2581bd;color:#075985}.note{font-size:11px;line-height:1.55;color:#5e6b76;background:#f5f7f9;padding:9px;border-radius:9px;margin-top:10px}.mapbox{position:relative;min-height:0}#map{height:100%;width:100%}.hint{position:absolute;right:10px;top:10px;z-index:800;background:#ffffffe8;padding:9px;border-radius:9px;font-size:12px;box-shadow:0 3px 14px #0002}.pin{width:30px;height:30px;background:#d93025;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #d9302550}.pin.safe{background:#198754;box-shadow:0 0 0 8px #19875450}.pin.wait{background:#f4b400;box-shadow:0 0 0 8px #f4b40050}.leaflet-tooltip.hazard-tip{border:0;border-radius:12px;background:#fff;color:#17212b;box-shadow:0 4px 18px #0003;padding:9px 12px;font-size:13px;font-weight:800;max-width:280px;white-space:normal}.leaflet-tooltip.hazard-tip:before{display:none}@media(max-width:760px){header{padding:9px 10px}h1{font-size:21px}.search input{font-size:17px;padding:14px 10px}.search button{padding:0 12px}.loc{font-size:0}.loc:after{content:'◎';font-size:21px}.body{display:flex;flex-direction:column}.mapbox{order:1;flex:none;height:53vh}.panel{order:2;border:0;border-top:2px solid #ccd8e2;padding:10px;overflow:visible}.summary strong{font-size:21px}.headline{font-size:19px}.riskgrid{grid-template-columns:1fr 1fr}.risk{min-height:82px}.risk .value{font-size:18px}}</style></head><body><div id="app"><header><h1>🛡️ 災害リスクマップ</h1><form id="form" class="search"><input id="q" autocomplete="postal-code" placeholder="住所・郵便番号（例 963-8052）"><button class="go">検索</button><button type="button" class="loc" id="loc">◎ 現在地</button></form><div id="status" class="status">住所・郵便番号を入力、または地図をタップしてください。</div></header><div class="body"><aside class="panel"><div class="summary"><strong id="place">地点を選択してください</strong><div id="coords" class="coords">—</div></div><div id="headline" class="headline wait">📍 地点を選択すると該当ハザードを表示</div><h2>このポイントに当てはまるハザード</h2><div id="riskgrid" class="riskgrid"></div><div class="section"><h2>地図に重ねる情報</h2><div id="chips" class="chips"></div></div><div class="note">赤いカード＝このポイントでハザードを検出。緑＝区域外またはデータなし。郵便番号は町域の代表地点なので、正確な確認には住所・地図タップを使ってください。地点判定は公開タイルによる簡易判定です。</div></aside><main class="mapbox"><div id="map"></div><div class="hint">📍 ポイントをタップ → 該当ハザードを表示</div></main></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([37.40,140.38],9);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル © 国土地理院'}).addTo(map);const D={flood:{n:'🌊 洪水（想定最大）',short:'洪水',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},floodplan:{n:'🌊 洪水（計画規模）',short:'洪水・計画規模',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l1_shinsuishin_newlegend_data/{z}/{x}/{y}.png',depth:1},duration:{n:'⏱️ 浸水継続時間',short:'浸水継続',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_keizoku_data/{z}/{x}/{y}.png'},collapseflow:{n:'🏠 家屋倒壊・氾濫流',short:'家屋倒壊・氾濫流',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png'},collapsebank:{n:'🏠 家屋倒壊・河岸侵食',short:'家屋倒壊・河岸侵食',u:'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png'},inland:{n:'💧 内水',short:'内水',u:'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',depth:1},hightide:{n:'🌊 高潮',short:'高潮',u:'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',depth:1},tsunami:{n:'🌊 津波',short:'津波',u:'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',depth:1},doseki:{n:'⛰️ 土石流',short:'土石流',u:'https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'},steep:{n:'⛰️ 急傾斜地',short:'急傾斜地',u:'https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png'},slide:{n:'⛰️ 地すべり',short:'地すべり',u:'https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'}};const layers={};for(const[k,d]of Object.entries(D)){layers[k]=L.tileLayer(d.u,{maxZoom:17,opacity:.72,errorTileUrl:''});const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=d.n;b.onclick=()=>{map.hasLayer(layers[k])?(map.removeLayer(layers[k]),b.classList.remove('on')):(layers[k].addTo(map),b.classList.add('on'))};chips.appendChild(b)}['flood','inland','hightide','tsunami','doseki','steep','slide'].forEach(k=>{layers[k].addTo(map);document.querySelector('[data-k="'+k+'"]').classList.add('on')});function tileXY(lat,lng,z=17){const n=2**z,x=(lng+180)/360*n,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n;return{z,tx:Math.floor(x),ty:Math.floor(y),px:Math.floor((x%1)*256),py:Math.floor((y%1)*256)}}function url(d,t){return d.u.replace('{z}',t.z).replace('{x}',t.tx).replace('{y}',t.ty)}function depthLabel(r,g,b,a){if(a<20)return null;const C=[[247,245,169,'0.3m未満'],[255,216,192,'0.3〜0.5m'],[255,183,183,'0.5〜1m'],[255,145,145,'1〜3m'],[242,133,201,'3〜5m'],[220,122,220,'5〜10m'],[180,110,210,'10〜20m'],[145,90,180,'20m以上']];let best=C[0],bd=1e9;for(const c of C){const d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bd){bd=d;best=c}}return bd<8000?best[3]:'区域内'}async function judge(k,lat,lng){const d=D[k],t=tileXY(lat,lng);try{const im=new Image;im.crossOrigin='anonymous';im.src=url(d,t);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no});const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.drawImage(im,0,0);let found=null;outer:for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const p=x.getImageData(Math.max(0,Math.min(255,t.px+dx)),Math.max(0,Math.min(255,t.py+dy)),1,1).data;if(p[3]>25){found=p;break outer}}if(!found)return{v:'区域外 / データなし',c:'clear'};return{v:d.depth?(depthLabel(...found)||'区域内'):'区域内',c:'hit'}}catch(e){return{v:'判定できません',c:'unknown'}}}function pinIcon(cls='wait'){return L.divIcon({className:'',html:'<div class="pin '+cls+'"></div>',iconSize:[30,30],iconAnchor:[15,15]})}let marker;function showPointResult(results){const hits=results.filter(([,r])=>r.c==='hit');if(hits.length){headline.className='headline hit';headline.innerHTML='⚠️ このポイントは <b>'+hits.length+'項目</b> 該当<br>'+hits.map(([k,r])=>D[k].short+(r.v==='区域内'?'':' '+r.v)).join(' ／ ');marker.setIcon(pinIcon(''));marker.bindTooltip('⚠️ 該当：'+hits.map(([k,r])=>D[k].short+(r.v==='区域内'?'':' '+r.v)).join('・'),{permanent:true,direction:'top',offset:[0,-18],className:'hazard-tip'}).openTooltip()}else{headline.className='headline clear';headline.textContent='✓ このポイントで検出されたハザードはありません';marker.setIcon(pinIcon('safe'));marker.bindTooltip('✓ 検出なし（データ未整備の可能性あり）',{permanent:true,direction:'top',offset:[0,-18],className:'hazard-tip'}).openTooltip()}}async function assess(lat,lng){riskgrid.innerHTML=Object.entries(D).map(([k,d])=>'<div class="risk unknown" id="r_'+k+'"><div class="name">'+d.n+'</div><div class="value">判定中…</div></div>').join('');headline.className='headline wait';headline.textContent='⏳ このポイントを判定中…';const results=await Promise.all(Object.keys(D).map(async k=>[k,await judge(k,lat,lng)]));for(const[k,r]of results){const e=document.getElementById('r_'+k);e.className='risk '+r.c;e.querySelector('.value').textContent=r.v}showPointResult(results);status.textContent='地点のハザード判定が完了しました。'}async function point(lat,lng,label){if(marker)marker.remove();marker=L.marker([lat,lng],{icon:pinIcon('wait')}).addTo(map);place.textContent=label||'選択地点';coords.textContent=lat.toFixed(6)+', '+lng.toFixed(6);status.textContent='ハザード情報を判定中…';assess(lat,lng)}map.on('click',e=>{map.setView(e.latlng,17);point(e.latlng.lat,e.latlng.lng,'地図上で選択した地点')});async function geocode(s){try{const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(s));const j=await r.json();return j&&j[0]}catch(e){return null}}function postal(s){return s.replace(/[〒\s-]/g,'').match(/^\d{7}$/)?.[0]||null}async function postalAddress(code){try{const r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+code);const j=await r.json();const a=j&&j.results&&j.results[0];return a?{address:(a.address1||'')+(a.address2||'')+(a.address3||''),label:'〒'+code.slice(0,3)+'-'+code.slice(3)+' '+(a.address1||'')+(a.address2||'')+(a.address3||'')}:null}catch(e){return null}}form.onsubmit=async e=>{e.preventDefault();const v=q.value.trim();if(!v)return;let search=v,label=v;const pc=postal(v);if(pc){status.textContent='郵便番号から住所を検索中…';const pa=await postalAddress(pc);if(!pa){status.textContent='郵便番号を特定できませんでした。';return}search=pa.address;label=pa.label}else status.textContent='住所を検索中…';const h=await geocode(search);if(!h){status.textContent='場所を特定できませんでした。';return}const[lng,lat]=h.geometry.coordinates;map.setView([lat,lng],17);point(lat,lng,pc?label:(h.properties?.title||v))};loc.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],17);point(p.coords.latitude,p.coords.longitude,'現在地')},()=>status.textContent='位置情報を取得できませんでした。',{enableHighAccuracy:true,timeout:10000});</script></body></html>
